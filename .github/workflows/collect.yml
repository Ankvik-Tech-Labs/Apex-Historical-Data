name: Collect Apex Historical Data

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Force full re-download (ignore prior release)"
        required: false
        default: "false"
        type: boolean

# Sharding strategy:
#   15m — 4 shards (most API calls: ~260 windows/pair × 135 pairs)
#   1h  — 2 shards
#   4h  — 1 shard
#   1d  — 1 shard
env:
  SHARD_MAP: '{"15m":4,"1h":2,"4h":1,"1d":1}'

jobs:
  # -------------------------------------------------------------------------
  # 1. Generate matrix from SHARD_MAP
  # -------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate shard matrix
        id: gen
        run: |
          python3 - <<'EOF'
          import json, os
          shard_map = json.loads(os.environ["SHARD_MAP"])
          items = []
          for tf, n in shard_map.items():
              for i in range(n):
                  items.append({"timeframe": tf, "shard": i, "total_shards": n})
          matrix = json.dumps({"include": items})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          print(f"Matrix: {len(items)} jobs")
          EOF

  # -------------------------------------------------------------------------
  # 2. Collect OHLCV — parallel matrix
  # -------------------------------------------------------------------------
  ohlcv:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download prior release (incremental)
        if: ${{ github.event.inputs.full_history != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prior_data
          TF="${{ matrix.timeframe }}"
          ASSET="apex-ohlcv-${TF}.zip"
          gh release download latest --pattern "$ASSET" --dir /tmp/prior_zip \
            --repo "${{ github.repository }}" 2>/dev/null || true
          if [ -f "/tmp/prior_zip/$ASSET" ]; then
            unzip -q "/tmp/prior_zip/$ASSET" -d prior_data/
            echo "Loaded prior data for $TF"
          else
            echo "No prior release found — full download"
          fi

      - name: Collect OHLCV
        run: |
          PRIOR_ARG=""
          if [ -d "prior_data" ] && [ "$(ls -A prior_data 2>/dev/null)" ]; then
            PRIOR_ARG="--prior-data-dir prior_data"
          fi
          python collector/collect_ohlcv.py \
            --timeframe ${{ matrix.timeframe }} \
            --shard ${{ matrix.shard }} \
            --total-shards ${{ matrix.total_shards }} \
            --out-dir data/ \
            $PRIOR_ARG

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohlcv-${{ matrix.timeframe }}-shard${{ matrix.shard }}
          path: data/
          retention-days: 1

  # -------------------------------------------------------------------------
  # 3. Merge shards, generate manifest, publish release
  # -------------------------------------------------------------------------
  publish:
    needs: ohlcv
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ohlcv-*
          path: merged/
          merge-multiple: true

      - name: Package per-timeframe zips
        run: |
          mkdir -p release_assets
          for TF in 15m 1h 4h 1d; do
            zip -j release_assets/apex-ohlcv-${TF}.zip merged/*-${TF}-futures.feather 2>/dev/null || true
            if [ -f release_assets/apex-ohlcv-${TF}.zip ]; then
              COUNT=$(unzip -l release_assets/apex-ohlcv-${TF}.zip | tail -1 | awk '{print $2}')
              echo "apex-ohlcv-${TF}.zip: $COUNT files"
            fi
          done

      - name: Generate manifest and release notes
        run: |
          python collector/make_manifest.py --data-dir merged --out-dir release_assets

      - name: Delete old latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --repo "${{ github.repository }}" 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat release_assets/release_notes.md)
          gh release create latest \
            --title "Apex DEX Historical Data (latest)" \
            --notes "$BODY" \
            --repo "${{ github.repository }}" \
            release_assets/apex-ohlcv-15m.zip \
            release_assets/apex-ohlcv-1h.zip \
            release_assets/apex-ohlcv-4h.zip \
            release_assets/apex-ohlcv-1d.zip \
            release_assets/manifest.json \
            release_assets/release_notes.md
