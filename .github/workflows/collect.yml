name: Collect Apex Historical Data

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

permissions:
  contents: read

# Sharding strategy:
#   15m — 4 shards (most API calls: ~260 windows/pair × 135 pairs)
#   1h  — 2 shards
#   4h  — 1 shard
#   1d  — 1 shard
env:
  SHARD_MAP: '{"15m":4,"1h":2,"4h":1,"1d":1}'

jobs:
  # -------------------------------------------------------------------------
  # 1. Generate matrix from SHARD_MAP
  # -------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      snapshot_tag: ${{ steps.gen.outputs.snapshot_tag }}
      collection_cutoff: ${{ steps.gen.outputs.collection_cutoff }}
      base_snapshot: ${{ steps.gen.outputs.base_snapshot }}
    steps:
      - name: Generate shard matrix
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAPSHOT_TAG=$(date -u +%F)
          COLLECTION_CUTOFF=$(date -u +%s)
          if gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $SNAPSHOT_TAG already exists" >&2
            exit 1
          fi
          BASE_SNAPSHOT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt --jq '.[] | select(.tagName | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) | .tagName' | head -n 1)
          export SNAPSHOT_TAG COLLECTION_CUTOFF BASE_SNAPSHOT
          python3 - <<'EOF'
          import json, os
          shard_map = json.loads(os.environ["SHARD_MAP"])
          items = []
          for tf, n in shard_map.items():
              for i in range(n):
                  items.append({"timeframe": tf, "shard": i, "total_shards": n})
          matrix = json.dumps({"include": items})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"snapshot_tag={os.environ['SNAPSHOT_TAG']}\n")
              f.write(f"collection_cutoff={os.environ['COLLECTION_CUTOFF']}\n")
              f.write(f"base_snapshot={os.environ.get('BASE_SNAPSHOT', '')}\n")
          print(f"Matrix: {len(items)} jobs")
          EOF

  # -------------------------------------------------------------------------
  # 2. Collect OHLCV — parallel matrix
  # -------------------------------------------------------------------------
  ohlcv:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect OHLCV
        run: |
          python collector/collect_ohlcv.py \
            --timeframe ${{ matrix.timeframe }} \
            --shard ${{ matrix.shard }} \
            --total-shards ${{ matrix.total_shards }} \
            --out-dir data/ \
            --until ${{ needs.setup.outputs.collection_cutoff }}

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohlcv-${{ matrix.timeframe }}-shard${{ matrix.shard }}
          path: data/
          retention-days: 1

  # -------------------------------------------------------------------------
  # 3. Merge shards, generate manifest, publish release
  # -------------------------------------------------------------------------
  publish:
    needs: [setup, ohlcv]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ohlcv-*
          path: merged/
          merge-multiple: true

      - name: Download baseline release
        if: ${{ needs.setup.outputs.base_snapshot != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/baseline_zip baseline
          for TF in 15m 1h 4h 1d; do
            ASSET="apex-ohlcv-${TF}.zip"
            gh release download "${{ needs.setup.outputs.base_snapshot }}" \
              --pattern "$ASSET" \
              --dir /tmp/baseline_zip \
              --repo "${{ github.repository }}"
            if [ ! -f "/tmp/baseline_zip/$ASSET" ]; then
              echo "Missing baseline asset $ASSET" >&2
              exit 1
            fi
            unzip -q "/tmp/baseline_zip/$ASSET" -d baseline/
            rm -f "/tmp/baseline_zip/$ASSET"
          done

      - name: Validate snapshot coverage
        run: |
          BASE_SNAPSHOT="${{ needs.setup.outputs.base_snapshot }}"
          if [ -n "$BASE_SNAPSHOT" ]; then
            python collector/validate_snapshot.py --candidate-dir merged --baseline-dir baseline
          else
            python collector/validate_snapshot.py --candidate-dir merged
          fi

      - name: Package per-timeframe zips
        run: |
          mkdir -p release_assets
          shopt -s nullglob
          for TF in 15m 1h 4h 1d; do
            files=(merged/*-${TF}-futures.feather)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No feather files found for $TF" >&2
              exit 1
            fi
            zip -j "release_assets/apex-ohlcv-${TF}.zip" "${files[@]}"
            COUNT=$(unzip -l "release_assets/apex-ohlcv-${TF}.zip" | tail -1 | awk '{print $2}')
            echo "apex-ohlcv-${TF}.zip: $COUNT files"
          done

      - name: Generate manifest and release notes
        run: |
          python collector/make_manifest.py \
            --data-dir merged \
            --out-dir release_assets \
            --snapshot-date "${{ needs.setup.outputs.snapshot_tag }}" \
            --base-snapshot "${{ needs.setup.outputs.base_snapshot }}"

      - name: Publish dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.setup.outputs.snapshot_tag }}" \
            --title "Apex DEX Historical Data (${{ needs.setup.outputs.snapshot_tag }})" \
            --notes-file release_assets/release_notes.md \
            --repo "${{ github.repository }}" \
            release_assets/apex-ohlcv-15m.zip \
            release_assets/apex-ohlcv-1h.zip \
            release_assets/apex-ohlcv-4h.zip \
            release_assets/apex-ohlcv-1d.zip \
            release_assets/manifest.json \
            release_assets/release_notes.md
